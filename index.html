<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة الرقمية الجامعية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #07090f; /* أسود أزرق داكن فخم */
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #e2e8f0;
    }
    .supabase-exact-card {
      background-color: #0f131f; /* لون بطاقات آيفون داكن أنيق */
      border: 1px solid rgba(59, 130, 246, 0.15); /* إطار أزرق خفيف جداً */
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .supabase-exact-card:hover {
      transform: translateY(-2px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 15px 35px 0 rgba(14, 116, 144, 0.2);
    }
    .supabase-exact-input {
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.2s ease;
    }
    .supabase-exact-input:focus {
      border-color: #3b82f6;
      outline: none;
      background-color: #0f131f;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
    }
    .btn-smooth {
      transition: all 0.2s ease;
    }
    .btn-smooth:active {
      transform: scale(0.96);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
  <script>
    const savedUser = localStorage.getItem('currentUser_v4');
    if (savedUser) {
      document.documentElement.style.visibility = 'hidden';
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.documentElement.style.visibility = 'visible';
      });
    }
  </script>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen relative">

  <!-- شاشة التحميل -->
  <div id="global-loader" class="hidden fixed inset-0 bg-[#07090f]/90 backdrop-blur-md flex flex-col items-center justify-center z-50 transition-opacity duration-200">
    <div class="p-4 rounded-2xl bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-4 shadow-lg animate-spin" style="animation-duration: 1s;">
      <i class="fa-solid fa-spinner text-3xl"></i>
    </div>
    <p id="loader-text" class="text-white font-semibold text-sm">جاري التحقق والاتصال بقاعدة البيانات...</p>
  </div>

  <div class="w-full max-w-6xl animate-fade">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="supabase-exact-card rounded-3xl p-8 max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex p-4 rounded-2xl bg-blue-500/10 text-blue-400 mb-3 border border-blue-500/20 shadow-inner">
          <i class="fa-solid fa-graduation-cap text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">المكتبة الرقمية الجامعية</h2>
        <p class="text-gray-400 text-sm mt-1">أدخل اسمك والكود الخاص بك للدخول الآمن</p>
      </div>

      <form id="login-form" onsubmit="handleSmartLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الاسم بالكامل</label>
          <input type="text" id="user-name" required placeholder="أدخل اسمك المسجل..." class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الكود السري للدخول</label>
          <input type="password" id="user-code" required placeholder="أدخل كودك الخاص..." class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-500">
        </div>

        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition-all shadow-lg shadow-blue-600/30 btn-smooth text-white">
          دخول المنصة 🚀
        </button>
      </form>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="app-screen" class="hidden space-y-6 animate-fade">
      <header class="supabase-exact-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4 relative">
        <!-- معلومات المستخدم والترحيب -->
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="p-3 bg-blue-500/10 rounded-xl border border-blue-500/20 text-blue-400">
            <i class="fa-solid fa-book-bookmark text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white" id="welcome-title">مرحباً بك في المكتبة الرقمية الجامعية</h1>
            <span id="role-badge" class="inline-block px-3 py-1 text-xs rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30 mt-1">طالب</span>
          </div>
        </div>

        <!-- الأزرار والترس في أقصى اليسار -->
        <div class="flex items-center gap-3 flex-wrap">
          <div id="management-actions" class="hidden flex gap-2 flex-wrap">
            <button onclick="openUsersModal()" class="px-3.5 py-2 bg-indigo-600/80 hover:bg-indigo-600 text-xs font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-users"></i> المستخدمين
            </button>
            <button onclick="openAddStudentModal()" class="px-3.5 py-2 bg-cyan-600/80 hover:bg-cyan-600 text-xs font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-user-plus"></i> + طالب
            </button>
            <button onclick="openAddSubjectModal()" id="admin-add-subject-btn" class="hidden px-3.5 py-2 bg-blue-600/80 hover:bg-blue-600 text-xs font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-folder-plus"></i> + مادة
            </button>
            <button onclick="openAddGlobalSectionModal()" id="admin-add-section-btn" class="hidden px-3.5 py-2 bg-sky-600/80 hover:bg-sky-600 text-xs font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-bookmark"></i> + سكشن
            </button>
          </div>

          <!-- زر الخروج -->
          <button onclick="logout()" class="px-3.5 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600/30 text-xs font-semibold rounded-xl transition flex items-center gap-2 btn-smooth">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
          </button>

          <!-- زر الترس (قائمة التنقل السريع) -->
          <button onclick="openNavigationHub()" title="القائمة الرئيسية" class="p-3 bg-white/10 hover:bg-white/20 text-blue-400 border border-white/15 rounded-xl transition flex items-center gap-2 btn-smooth shadow-lg">
            <i class="fa-solid fa-gear text-lg animate-spin" style="animation-duration: 10s;"></i>
            <span class="text-xs font-bold text-white hidden sm:inline">القائمة</span>
          </button>
        </div>
      </header>

      <!-- عنوان القسم الحالي -->
      <div id="section-header-banner" class="flex items-center justify-between px-2">
        <h2 id="current-view-title" class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-book text-blue-400"></i> المواد الدراسية
        </h2>
      </div>

      <!-- منطقة العرض الرئيسية -->
      <div id="main-content-area" class="mt-2">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="subjects-grid">
        </div>
      </div>
    </div>

  </div>

  <!-- نافذة التنقل السريع بين المواد والسكاشن -->
  <div id="nav-hub-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade">
    <div class="supabase-exact-card rounded-3xl p-6 w-full max-w-md border border-blue-500/20 shadow-2xl relative text-center">
      <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
        <h3 class="text-lg font-bold text-white">قائمة التنقل السريع</h3>
        <button onclick="closeNavigationHub()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/10 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-4">
        <button onclick="switchMainView('subjects'); closeNavigationHub();" class="w-full p-4 rounded-2xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-white font-bold transition flex items-center justify-between group btn-smooth">
          <div class="flex items-center gap-3">
            <span class="p-2.5 bg-blue-500/20 text-blue-400 rounded-xl">
              <i class="fa-solid fa-book text-lg"></i>
            </span>
            <span>المواد الدراسية</span>
          </div>
          <i class="fa-solid fa-chevron-left text-blue-400 group-hover:-translate-x-1 transition"></i>
        </button>

        <button onclick="switchMainView('sections'); closeNavigationHub();" class="w-full p-4 rounded-2xl bg-sky-600/20 hover:bg-sky-600/30 border border-sky-500/30 text-white font-bold transition flex items-center justify-between group btn-smooth">
          <div class="flex items-center gap-3">
            <span class="p-2.5 bg-sky-500/20 text-sky-400 rounded-xl">
              <i class="fa-solid fa-layer-group text-lg"></i>
            </span>
            <span>السكاشن والأقسام</span>
          </div>
          <i class="fa-solid fa-chevron-left text-sky-400 group-hover:-translate-x-1 transition"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://daapgugcfilwljswxwku.supabase.co";
    const SUPABASE_KEY = "sb_publishable__3MPuIGColJm2-LjAD3VbQ_y4ygMffp";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_CODE = "ADMIN2026";
    const SUBADMIN_CODE = "SUBADMIN2026";

    let defaultSubjects = [
      { id: '1', name: 'أساسيات إدارة الأعمال', doctor: 'أ.د.م. أحمد سيد عبد الباسط مصطفي', code: 'DOC101', content: [] },
      { id: '2', name: 'مقدمة في نظم المعلومات', doctor: 'د. محمد حامد حامد', code: 'DOC102', content: [] },
      { id: '3', name: 'المحاسبة المالية', doctor: 'د. ناهد سعد أحمد سعد', code: 'DOC103', content: [] },
      { id: '4', name: 'مقدمة في الاقتصاد الجزئي', doctor: 'د. محمد عبد المنعم محمد الشهاوي', code: 'DOC104', content: [] },
      { id: '5', name: 'رياضة مالية', doctor: 'أ.د.م. محمد جمال محمد إبراهيم', code: 'DOC105', content: [] }
    ];

    let subjects = [];
    let sectionsList = [];
    let students = [];
    let currentUser = JSON.parse(localStorage.getItem('currentUser_v4')) || null;
    let currentViewMode = 'subjects';

    function showLoader(text = "جاري التحقق...") {
      const loader = document.getElementById('global-loader');
      document.getElementById('loader-text').innerText = text;
      loader.classList.remove('hidden');
    }

    function hideLoader() {
      document.getElementById('global-loader').classList.add('hidden');
    }

    function openNavigationHub() {
      document.getElementById('nav-hub-modal').classList.remove('hidden');
    }

    function closeNavigationHub() {
      document.getElementById('nav-hub-modal').classList.add('hidden');
    }

    window.onload = function() {
      if (currentUser) {
        showLoader("جاري استرجاع الجلسة وسحب البيانات...");
        loadDataFromSupabase().then(() => {
          hideLoader();
          showAppScreen();
        });
      }
    };

    async function loadDataFromSupabase() {
      try {
        const { data: dbStudents } = await supabaseClient.from('students').select('*');
        if (dbStudents && dbStudents.length > 0) students = dbStudents;
        else students = [{ name: 'طالب تجريبي', code: '1234' }];

        const { data: dbSubjects } = await supabaseClient.from('subjects').select('*');
        if (dbSubjects && dbSubjects.length > 0) subjects = dbSubjects;
        else {
          subjects = defaultSubjects;
          for(let sub of defaultSubjects) {
            await supabaseClient.from('subjects').upsert([sub]);
          }
        }

        const { data: dbSections } = await supabaseClient.from('sections').select('*');
        if (dbSections) sectionsList = dbSections;
      } catch (err) {
        console.log("خطأ في الاتصال، جارٍ استخدام البيانات المحلية");
        subjects = defaultSubjects;
        students = [{ name: 'طالب تجريبي', code: '1234' }];
      }
    }

    async function handleSmartLogin(e) {
      e.preventDefault();
      showLoader("جاري التحقق من قاعدة البيانات وسحب البيانات...");
      
      const nameInput = document.getElementById('user-name').value.trim();
      const codeInput = document.getElementById('user-code').value.trim();

      await loadDataFromSupabase();

      if (codeInput === ADMIN_CODE) {
        currentUser = { role: 'admin', name: nameInput || 'مسؤول النظام (الأدمن)' };
      } else if (codeInput === SUBADMIN_CODE) {
        currentUser = { role: 'subadmin', name: nameInput || 'مساعد مسؤول النظام' };
      } else {
        const docSub = subjects.find(s => String(s.code).trim() === codeInput);
        if (docSub) {
          currentUser = { role: 'doctor', subjectId: docSub.id, name: nameInput ? `${nameInput} (${docSub.doctor})` : docSub.doctor };
        } else {
          const student = students.find(s => 
            String(s.name).trim().toLowerCase() === nameInput.toLowerCase() && 
            String(s.code).trim() === codeInput
          );
          
          if (student) {
            currentUser = { role: 'student', name: student.name };
          } else {
            hideLoader();
            alert('الاسم أو الكود السري غير صحيح، أو غير متطابقين في قاعدة البيانات!');
            return;
          }
        }
      }

      localStorage.setItem('currentUser_v4', JSON.stringify(currentUser));
      hideLoader();
      showAppScreen();
    }

    function showAppScreen() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      document.getElementById('welcome-title').innerText = `أهلاً بك، ${currentUser.name}`;
      
      const badge = document.getElementById('role-badge');
      if (currentUser.role === 'admin') {
        badge.innerText = 'مسؤول النظام (الأدمن)';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-rose-500/25 text-rose-300 border border-rose-500/40 mt-1';
        document.getElementById('admin-add-subject-btn').classList.remove('hidden');
        document.getElementById('admin-add-section-btn').classList.remove('hidden');
      } else if (currentUser.role === 'subadmin') {
        badge.innerText = 'مساعد مسؤول النظام';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-amber-500/25 text-amber-300 border border-amber-500/40 mt-1';
        document.getElementById('admin-add-section-btn').classList.remove('hidden');
      } else if (currentUser.role === 'doctor') {
        badge.innerText = 'دكتور مادة';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-purple-500/25 text-purple-300 border border-purple-500/40 mt-1';
        document.getElementById('admin-add-section-btn').classList.remove('hidden');
      } else {
        badge.innerText = 'طالب';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-blue-500/25 text-blue-300 border border-blue-500/30 mt-1';
      }

      if (currentUser.role === 'admin' || currentUser.role === 'subadmin') {
        document.getElementById('management-actions').classList.remove('hidden');
      }

      renderCurrentView();
    }

    function switchMainView(mode) {
      currentViewMode = mode;
      renderCurrentView();
    }

    async function renderCurrentView() {
      await loadDataFromSupabase();
      const area = document.getElementById('main-content-area');
      const viewTitle = document.getElementById('current-view-title');
      area.innerHTML = '';

      if (currentViewMode === 'subjects') {
        viewTitle.innerHTML = `<i class="fa-solid fa-book text-blue-400"></i> المواد الدراسية`;
        let gridHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade">`;
        subjects.forEach(sub => {
          const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
          const canUpload = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;
          const isAdmin = currentUser.role === 'admin';
          const contentList = sub.content || [];
          
          let totalFiles = 0;
          contentList.forEach(sec => { if (sec.files) totalFiles += sec.files.length; });

          gridHtml += `
            <div class="supabase-exact-card rounded-2xl p-6 flex flex-col justify-between relative group">
              <div>
                <div class="flex justify-between items-start mb-4">
                  <span class="p-3 bg-blue-500/10 text-blue-400 rounded-xl border border-blue-500/20">
                    <i class="fa-solid fa-book-open text-2xl"></i>
                  </span>
                  <div class="flex gap-2 flex-wrap">
                    ${isAdmin ? `
                      <button onclick="editSubject('${sub.id}')" title="تعديل المادة" class="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30 rounded-lg text-xs font-semibold transition btn-smooth"><i class="fa-solid fa-pen"></i></button>
                      <button onclick="deleteSubject('${sub.id}')" title="حذف المادة" class="px-2.5 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 rounded-lg text-xs font-semibold transition btn-smooth"><i class="fa-solid fa-trash"></i></button>
                    ` : ''}
                  </div>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">${sub.name}</h3>
                <p class="text-sm text-gray-300 mb-4 flex items-center gap-2"><i class="fa-solid fa-user-tie text-xs text-blue-400"></i> ${sub.doctor}</p>
              </div>

              <div class="pt-4 border-t border-white/10 flex justify-between items-center">
                <span class="text-xs text-gray-400">${totalFiles} ملفات</span>
                <button onclick="openSubjectContent('${sub.id}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 btn-smooth shadow-lg shadow-blue-600/20">
                  عرض المادة 📂
                </button>
              </div>
            </div>
          `;
        });
        gridHtml += `</div>`;
        area.innerHTML = gridHtml;
      } else {
        viewTitle.innerHTML = `<i class="fa-solid fa-layer-group text-sky-400"></i> السكاشن والأقسام الجامعية المستقلة`;
        let hubHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade">`;

        if (sectionsList.length === 0) {
          hubHtml = `<div class="text-center py-12 text-gray-400 col-span-full"><p>لا توجد سكاشن مسجلة حالياً. اضغط على "+ سكشن" لإضافة أول سكشن.</p></div>`;
        } else {
          sectionsList.forEach(sec => {
            const filesCount = sec.files ? sec.files.length : 0;
            hubHtml += `
              <div class="supabase-exact-card rounded-2xl p-6 flex flex-col justify-between relative group">
                <div>
                  <div class="flex justify-between items-start mb-4">
                    <span class="p-3 bg-sky-500/10 text-sky-400 rounded-xl border border-sky-500/20">
                      <i class="fa-solid fa-bookmark text-2xl"></i>
                    </span>
                    ${(currentUser.role === 'admin' || currentUser.role === 'subadmin' || currentUser.role === 'doctor') ? `
                      <button onclick="deleteGlobalSection('${sec.id}')" title="حذف السكشن" class="px-2.5 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 rounded-lg text-xs font-semibold transition btn-smooth"><i class="fa-solid fa-trash"></i></button>
                    ` : ''}
                  </div>
                  <h3 class="text-xl font-bold text-white mb-2">${sec.title}</h3>
                  <p class="text-sm text-gray-300 mb-1 flex items-center gap-2"><i class="fa-solid fa-user-tie text-xs text-sky-400"></i> ${sec.doctor}</p>
                  <p class="text-xs text-gray-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-book text-xs text-blue-400"></i> ${sec.subject_name}</p>
                </div>

                <div class="pt-4 border-t border-white/10 flex justify-between items-center">
                  <span class="text-xs text-gray-400">${filesCount} ملفات PDF</span>
                  <button onclick="openSectionContent('${sec.id}')" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 btn-smooth shadow-lg shadow-sky-600/20">
                    عرض السكشن 📂
                  </button>
                </div>
              </div>
            `;
          });
          hubHtml += `</div>`;
        }
        area.innerHTML = hubHtml;
      }
    }

    async function openAddGlobalSectionModal() {
      const title = prompt('عنوان السكشن (مثل: سكشن المحاسبة - الأسبوع الأول):');
      if (!title) return;
      const doctor = prompt('اسم المعيد أو الدكتور المسؤول عن السكشن:');
      if (!doctor) return;
      const subject_name = prompt('اسم المادة التابع لها السكشن:');
      if (!subject_name) return;

      const newSec = {
        id: String(Date.now()),
        title: title.trim(),
        doctor: doctor.trim(),
        subject_name: subject_name.trim(),
        files: []
      };

      await supabaseClient.from('sections').insert([newSec]);
      await loadDataFromSupabase();
      renderCurrentView();
      alert('تمت إضافة السكشن المستقل بنجاح وحفظه في سوبارباز!');
    }

    async function deleteGlobalSection(secId) {
      if (!confirm('هل أنت متأكد من حذف هذا السكشن بالكامل؟')) return;
      await supabaseClient.from('sections').delete().eq('id', secId);
      await loadDataFromSupabase();
      renderCurrentView();
    }

    async function openSectionContent(secId) {
      await loadDataFromSupabase();
      const sec = sectionsList.find(s => String(s.id) === String(secId));
      if (!sec) return;

      const canManage = currentUser.role === 'admin' || currentUser.role === 'subadmin' || currentUser.role === 'doctor';

      let modalOverlay = document.getElementById('subject-modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'subject-modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }

      let contentHtml = `
        <div class="supabase-exact-card rounded-3xl p-6 w-full max-w-3xl max-h-[85vh] overflow-y-auto border border-blue-500/20 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-white">${sec.title}</h2>
                    <p class="text-sm text-sky-300 mt-1"><i class="fa-solid fa-user-tie"></i> ${sec.doctor} | <i class="fa-solid fa-book"></i> ${sec.subject_name}</p>
                </div>
                <button onclick="closeSubjectModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/10 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
      `;

      if (canManage) {
          contentHtml += `
              <div class="mb-6 flex gap-3 flex-wrap bg-blue-950/20 p-4 rounded-2xl border border-blue-500/30">
                  <button onclick="addFileToSection('${sec.id}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl transition flex items-center gap-2 shadow-lg btn-smooth">
                      <i class="fa-solid fa-file-arrow-up"></i> + إضافة ملف PDF للسكشن
                  </button>
              </div>
          `;
      }

      if (!sec.files || sec.files.length === 0) {
          contentHtml += `
              <div class="text-center py-12 text-gray-400">
                  <i class="fa-solid fa-folder-open text-4xl mb-3 text-blue-400"></i>
                  <p>لا توجد ملفات PDF مرفوعة لهذا السكشن حتى الآن.</p>
              </div>
          `;
      } else {
          contentHtml += `<div class="space-y-2">`;
          sec.files.forEach((file, fIndex) => {
              contentHtml += `
                  <div class="flex justify-between items-center bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-white/5 transition">
                      <div class="flex items-center gap-3">
                          <span class="p-2 bg-red-500/20 text-red-400 rounded-lg border border-red-500/30">
                              <i class="fa-solid fa-file-pdf"></i>
                          </span>
                          <div>
                              <h4 class="font-semibold text-sm text-white">${file.title}</h4>
                              <span class="text-xs text-gray-400">${file.date || ''}</span>
                          </div>
                      </div>
                      <div class="flex items-center gap-2">
                          <a href="${file.link}" target="_blank" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition flex items-center gap-1.5 btn-smooth">
                              <i class="fa-solid fa-eye"></i> عرض
                          </a>
                          ${canManage ? `
                              <button onclick="deleteFileFromSection('${sec.id}',${fIndex})" class="p-1.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-lg text-xs transition btn-smooth" title="حذف الملف">
                                  <i class="fa-solid fa-trash"></i>
                              </button>
                          ` : ''}
                      </div>
                  </div>
              `;
          });
          contentHtml += `</div>`;
      }

      contentHtml += `</div>`;
      modalOverlay.innerHTML = contentHtml;
    }

    async function addFileToSection(secId) {
      const sec = sectionsList.find(s => String(s.id) === String(secId));
      if (!sec) return;

      const title = prompt('اسم ملف الـ PDF:');
      const link = prompt('رابط الملف (رابط مباشر أو Google Drive):');

      if (title && link) {
        if (!sec.files) sec.files = [];
        sec.files.push({
          id: String(Date.now()),
          title: title.trim(),
          link: link.trim(),
          date: new Date().toLocaleDateString('ar-EG')
        });

        await supabaseClient.from('sections').upsert([sec]);
        openSectionContent(secId);
        renderCurrentView();
        alert('تم رفع الملف بنجاح داخل السكشن وحفظه أونلاين!');
      }
    }

    async function deleteFileFromSection(secId, fIndex) {
      const sec = sectionsList.find(s => String(s.id) === String(secId));
      if (!sec || !confirm('هل أنت متأكد من حذف هذا الملف؟')) return;

      sec.files.splice(fIndex, 1);
      await supabaseClient.from('sections').upsert([sec]);
      openSectionContent(secId);
      renderCurrentView();
    }

    async function openAddSubjectModal() {
      if (currentUser.role !== 'admin') return;
      const name = prompt('اسم المادة الجديدة:');
      if (!name) return;
      const doctor = prompt('اسم الدكتور المحاضر:');
      const code = prompt('كود دخول الدكتور الخاص بالمادة (مثل DOC106):');
      
      if (name && doctor && code) {
        const newSub = {
          id: String(Date.now()),
          name: name.trim(),
          doctor: doctor.trim(),
          code: code.trim(),
          content: []
        };
        await supabaseClient.from('subjects').upsert([newSub]);
        await renderCurrentView();
        alert('تمت إضافة المادة الجديدة بنجاح أونلاين!');
      }
    }

    async function editSubject(subId) {
      if (currentUser.role !== 'admin') return;
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const newName = prompt('تعديل اسم المادة:', sub.name);
      if (newName === null) return;
      const newDoc = prompt('تعديل اسم الدكتور المحاضر:', sub.doctor);
      if (newDoc === null) return;
      const newCode = prompt('تعديل كود دخول الدكتور للمادة:', sub.code);
      if (newCode === null) return;

      sub.name = newName || sub.name;
      sub.doctor = newDoc || sub.doctor;
      sub.code = newCode || sub.code;

      await supabaseClient.from('subjects').upsert([sub]);
      renderCurrentView();
      alert('تم تحديث بيانات المادة بنجاح!');
    }

    async function deleteSubject(subId) {
      if (currentUser.role !== 'admin') return;
      if (!confirm('هل أنت متأكد من حذف هذه المادة بالكامل؟')) return;

      await supabaseClient.from('subjects').delete().eq('id', subId);
      await renderCurrentView();
      alert('تم حذف المادة بنجاح!');
    }

    async function openSubjectContent(subId) {
      await loadDataFromSupabase();
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
      const canManage = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;

      if (!sub.content || !Array.isArray(sub.content)) sub.content = [];

      let modalOverlay = document.getElementById('subject-modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'subject-modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }

      let contentHtml = `
        <div class="supabase-exact-card rounded-3xl p-6 w-full max-w-3xl max-h-[85vh] overflow-y-auto border border-blue-500/20 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-white">${sub.name}</h2>
                    <p class="text-sm text-blue-300 mt-1"><i class="fa-solid fa-user-tie"></i> د. ${sub.doctor}</p>
                </div>
                <button onclick="closeSubjectModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/10 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
      `;

      if (canManage) {
          contentHtml += `
              <div class="mb-6 flex gap-3 flex-wrap bg-blue-950/20 p-4 rounded-2xl border border-blue-500/30">
                  <button onclick="addNewSubjectSection('${sub.id}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl transition flex items-center gap-2 shadow-lg btn-smooth">
                      <i class="fa-solid fa-folder-plus"></i> + إضافة قسم داخل المادة
                  </button>
                  <button onclick="addNewFileToSubjectSection('${sub.id}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition flex items-center gap-2 shadow-lg btn-smooth">
                      <i class="fa-solid fa-file-arrow-up"></i> + إضافة ملف PDF
                  </button>
              </div>
          `;
      }

      if (sub.content.length === 0) {
          contentHtml += `
              <div class="text-center py-12 text-gray-400">
                  <i class="fa-solid fa-folder-open text-4xl mb-3 text-blue-400"></i>
                  <p>لا توجد أقسام أو ملفات مرفوعة لهذه المادة حتى الآن.</p>
              </div>
          `;
      } else {
          contentHtml += `<div class="space-y-6">`;
          sub.content.forEach((section, sIndex) => {
              contentHtml += `
                  <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                      <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                          <h3 class="font-bold text-lg text-blue-200 flex items-center gap-2">
                              <i class="fa-solid fa-bookmark text-blue-400 text-sm"></i> ${section.sectionTitle || 'محتوى عام'}
                          </h3>
                          ${canManage ? `
                              <button onclick="deleteSubjectSection('${sub.id}',${sIndex})" class="text-rose-400 hover:text-rose-300 text-xs px-2.5 py-1 bg-rose-500/10 border border-rose-500/20 rounded-lg transition btn-smooth">
                                  <i class="fa-solid fa-trash"></i> حذف القسم
                              </button>
                          ` : ''}
                      </div>
              `;

              if (!section.files || section.files.length === 0) {
                  contentHtml += `<p class="text-xs text-gray-400 py-2">لا توجد ملفات في هذا القسم بعد.</p>`;
              } else {
                  contentHtml += `<div class="space-y-2">`;
                  section.files.forEach((file, fIndex) => {
                      contentHtml += `
                          <div class="flex justify-between items-center bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-white/5 transition">
                              <div class="flex items-center gap-3">
                                  <span class="p-2 bg-red-500/20 text-red-400 rounded-lg border border-red-500/30">
                                      <i class="fa-solid fa-file-pdf"></i>
                                  </span>
                                  <div>
                                      <h4 class="font-semibold text-sm text-white">${file.title}</h4>
                                      <span class="text-xs text-gray-400">${file.date || ''}</span>
                                  </div>
                              </div>
                              <div class="flex items-center gap-2">
                                  <a href="${file.link}" target="_blank" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition flex items-center gap-1.5 btn-smooth">
                                      <i class="fa-solid fa-eye"></i> عرض
                                  </a>
                                  ${canManage ? `
                                      <button onclick="deleteSubjectFile('${sub.id}',${sIndex},${fIndex})" class="p-1.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-lg text-xs transition btn-smooth" title="حذف الملف">
                                          <i class="fa-solid fa-trash"></i>
                                      </button>
                                  ` : ''}
                              </div>
                          </div>
                      `;
                  });
                  contentHtml += `</div>`;
              }
              contentHtml += `</div>`;
          });
          contentHtml += `</div>`;
      }

      contentHtml += `</div>`;
      modalOverlay.innerHTML = contentHtml;
    }

    function closeSubjectModal() {
        const modal = document.getElementById('subject-modal-overlay');
        if (modal) modal.remove();
    }

    async function addNewSubjectSection(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub) return;
        const secTitle = prompt('عنوان القسم داخل المادة (مثل: المحاضرة الأولى / الأسبوع الأول):');
        if (!secTitle) return;

        if (!sub.content) sub.content = [];
        sub.content.push({ sectionTitle: secTitle.trim(), files: [] });

        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderCurrentView();
    }

    async function addNewFileToSubjectSection(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !sub.content || sub.content.length === 0) {
            alert('الرجاء إضافة قسم أولاً داخل المادة!');
            return;
        }

        let listSec = "اختر رقم القسم المراد الرفع فيه:\n";
        sub.content.forEach((sec, idx) => {
            listSec += `${idx + 1}. ${sec.sectionTitle}\n`;
        });
        const sIdx = parseInt(prompt(listSec)) - 1;

        if (isNaN(sIdx) || sIdx < 0 || sIdx >= sub.content.length) return;

        const title = prompt('اسم ملف الـ PDF:');
        const link = prompt('رابط الملف:');

        if (title && link) {
            if (!sub.content[sIdx].files) sub.content[sIdx].files = [];
            sub.content[sIdx].files.push({
                id: String(Date.now()),
                title: title.trim(),
                link: link.trim(),
                date: new Date().toLocaleDateString('ar-EG')
            });

            await supabaseClient.from('subjects').upsert([sub]);
            openSubjectContent(subId);
            renderCurrentView();
            alert('تم رفع الملف بنجاح!');
        }
    }

    async function deleteSubjectSection(subId, sIndex) {
        const sub = subjects.find(s.id === subId); // تم التصحيح
        if (!sub || !confirm('هل أنت متأكد من حذف هذا القسم؟')) return;

        sub.content.splice(sIndex, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderCurrentView();
    }

    async function deleteSubjectFile(subId, sIndex, fIndex) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !confirm('هل أنت متأكد من حذف هذا الملف؟')) return;

        sub.content[sIndex].files.splice(fIndex, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderCurrentView();
    }

    async function openAddStudentModal() {
      if (currentUser.role !== 'admin' && currentUser.role !== 'subadmin') return;
      const name = prompt('اسم الطالب الجديد:');
      if (!name) return;
      const code = prompt('كود الطالب الخاص بالدخول:');
      if (!code) return;

      if (name && code) {
        await supabaseClient.from('students').insert([{ name: name.trim(), code: code.trim() }]);
        await loadDataFromSupabase();
        alert('تمت إضافة الطالب بنجاح لقاعدة البيانات!');
      }
    }

    function openUsersModal() {
      let info = "قائمة الطلاب المسجلين في النظام:\n\n";
      students.forEach(s => {
        info += `- ${s.name} (الكود: ${s.code})\n`;
      });
      alert(info);
    }

    function logout() {
      localStorage.removeItem('currentUser_v4');
      location.reload();
    }
  </script>
</body>
</html>
