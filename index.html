<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة الرقمية الجامعية - Supabase Exact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0c0d10;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #ededed;
    }
    /* تصميم الكروت المطابق تماماً لـ Supabase الداكن */
    .supabase-exact-card {
      background-color: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .supabase-exact-card:hover {
      border-color: rgba(34, 197, 94, 0.3);
      transform: translateY(-2px);
    }
    .supabase-exact-input {
      background-color: #090a0d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.2s ease;
    }
    .supabase-exact-input:focus {
      border-color: #22c55e;
      outline: none;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    }
    /* زرار الأخضر النيون المطابق للصورة */
    .btn-supabase-exact {
      background-color: #16a34a;
      color: #ffffff;
      transition: all 0.15s ease;
    }
    .btn-supabase-exact:hover {
      background-color: #15803d;
    }
    .btn-supabase-exact:active {
      transform: scale(0.98);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.2s ease-out forwards;
    }
    .truncate-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <!-- فحص سريع لتسجيل الدخول لمنع أي وميض -->
  <script>
    const savedUser = localStorage.getItem('currentUser_v12');
    if (savedUser) {
      document.documentElement.style.visibility = 'hidden';
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.documentElement.style.visibility = 'visible';
      });
    }
  </script>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

  <script>
    function playClickSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }
  </script>

  <div class="w-full max-w-6xl animate-fade">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="supabase-exact-card rounded-2xl p-8 max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex p-3.5 rounded-xl bg-green-500/10 text-green-500 mb-3 border border-green-500/20">
          <i class="fa-solid fa-database text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">المكتبة الرقمية الجامعية</h2>
        <p class="text-gray-400 text-sm mt-1">سجل دخولك بالنظام السحابي الآمن</p>
      </div>

      <form id="login-form" onsubmit="handleSmartLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الاسم بالكامل (أو اتركها فارغة للإدارة)</label>
          <input type="text" id="user-name" placeholder="مثال: أحمد محمد..." class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-600 text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الكود السري للدخول</label>
          <input type="password" id="user-code" required placeholder="••••••••" class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-600 text-center tracking-widest text-lg font-bold">
        </div>

        <button type="submit" class="w-full py-3.5 btn-supabase-exact font-bold rounded-xl text-sm transition-all shadow-lg shadow-green-900/20">
          دخول المنصة ⚡
        </button>
      </form>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="app-screen" class="hidden space-y-6 animate-fade">
      <header class="supabase-exact-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4 relative">
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="p-3 bg-green-500/10 rounded-xl border border-green-500/20 text-green-500">
            <i class="fa-solid fa-server text-lg"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white" id="welcome-title">مرحباً بك</h1>
            <span id="role-badge" class="inline-block px-2.5 py-0.5 text-xs rounded-md bg-green-500/15 text-green-400 border border-green-500/20 mt-1">طالب</span>
          </div>
        </div>

        <div class="flex items-center gap-3 flex-wrap">
          <!-- زر الترس / القائمة الجانبية -->
          <div class="relative">
            <button onclick="playClickSound(); toggleMenuDropdown()" class="p-3 bg-[#181b25] hover:bg-[#202433] text-green-400 rounded-xl border border-white/10 transition flex items-center gap-2" title="قائمة الخيارات">
              <i class="fa-solid fa-gear text-base animate-spin" style="animation-duration: 12s;"></i>
            </button>
            
            <!-- القائمة المنسدلة للترس -->
            <div id="gear-dropdown" class="hidden absolute left-0 mt-2 w-48 supabase-exact-card rounded-xl p-1.5 shadow-2xl z-50 animate-fade">
              <button onclick="playClickSound(); closeMenuDropdown(); openLecturesModal()" class="w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 text-sm font-medium text-white transition flex items-center gap-2">
                <i class="fa-solid fa-book text-green-400 text-xs"></i> المحاضرات
              </button>
              <button onclick="playClickSound(); closeMenuDropdown(); openSectionsModal()" class="w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 text-sm font-medium text-white transition flex items-center gap-2">
                <i class="fa-solid fa-clock text-green-400 text-xs"></i> السكاشن
              </button>
              <button onclick="playClickSound(); closeMenuDropdown(); scrollToSubjects()" class="w-full text-right px-3 py-2 rounded-lg hover:bg-white/5 text-sm font-medium text-white transition flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-green-400 text-xs"></i> المواد
              </button>
            </div>
          </div>

          <div id="management-actions" class="hidden flex gap-2 flex-wrap">
            <button onclick="playClickSound(); openUsersModal()" class="px-3.5 py-2 bg-blue-500/10 text-blue-400 border border-blue-500/20 hover:bg-blue-500/20 text-xs font-semibold rounded-xl transition flex items-center gap-2">
              <i class="fa-solid fa-users"></i> المستخدمين
            </button>
            <button onclick="playClickSound(); openAddStudentModal()" class="px-3.5 py-2 bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20 text-xs font-semibold rounded-xl transition flex items-center gap-2">
              <i class="fa-solid fa-user-plus"></i> + طالب
            </button>
            <button onclick="playClickSound(); openAddSubjectModal()" id="admin-add-subject-btn" class="hidden px-3.5 py-2 bg-purple-500/10 text-purple-400 border border-purple-500/20 hover:bg-purple-500/20 text-xs font-semibold rounded-xl transition flex items-center gap-2">
              <i class="fa-solid fa-folder-plus"></i> + مادة
            </button>
          </div>

          <button onclick="playClickSound(); logout()" class="px-3.5 py-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 text-xs font-semibold rounded-xl transition flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
          </button>
        </div>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="subjects-grid">
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://daapugcfilwljswxwku.supabase.co";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const adminsConfig = {
      "SAQR11": { role: 'admin', name: 'المدير الرئيسي (Admin)' },
      "SAQR11SR": { role: 'subadmin', name: 'المساعد الأول' },
      "SAQR11SR1": { role: 'subadmin', name: 'المساعد الثاني' }
    };

    let subjects = [];
    let students = [];
    let scheduleInfo = { lectures: "جدول محاضرات الترم الأول ثابت.", sections: "جدول السيكاشن الأسبوعي الجديد." };
    let currentUser = savedUser ? JSON.parse(savedUser) : null;
    let dataLoaded = false;

    window.onload = async function() {
      await loadDataFast();
      if (currentUser) {
        showAppScreen();
      }
    };

    async function loadDataFast() {
      if (dataLoaded && subjects.length > 0) return;
      try {
        const [subRes, stuRes, cfgRes] = await Promise.all([
          supabaseClient.from('subjects').select('*'),
          supabaseClient.from('students').select('*'),
          supabaseClient.from('configs').select('*').eq('key', 'schedule_data').single()
        ]);

        if (subRes.data) subjects = subRes.data;
        if (stuRes.data) students = stuRes.data;
        if (cfgRes.data) scheduleInfo = cfgRes.data.value;
        dataLoaded = true;
      } catch (err) {
        console.log("استخدام الذاكرة المؤقتة");
      }
    }

    function toggleMenuDropdown() {
      const drop = document.getElementById('gear-dropdown');
      drop.classList.toggle('hidden');
    }

    function closeMenuDropdown() {
      document.getElementById('gear-dropdown').classList.add('hidden');
    }

    function scrollToSubjects() {
      window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    async function handleSmartLogin(e) {
      e.preventDefault();
      playClickSound();
      const nameInput = document.getElementById('user-name').value.trim();
      const codeInput = document.getElementById('user-code').value.trim();

      await loadDataFast();

      if (adminsConfig[codeInput]) {
        currentUser = adminsConfig[codeInput];
      } else {
        const docSub = subjects.find(s => String(s.code).trim() === codeInput);
        if (docSub) {
          currentUser = { role: 'doctor', subjectId: docSub.id, name: nameInput ? `${nameInput} (د. ${docSub.doctor})` : `دكتور ${docSub.doctor}` };
        } else {
          const student = students.find(s => 
            String(s.code).trim() === codeInput && 
            (!nameInput || String(s.name).trim().toLowerCase() === nameInput.toLowerCase())
          );
          
          if (student) {
            currentUser = { role: 'student', name: student.name };
          } else {
            alert('الاسم أو الكود السري غير صحيح!');
            return;
          }
        }
      }

      localStorage.setItem('currentUser_v12', JSON.stringify(currentUser));
      showAppScreen();
    }

    function showAppScreen() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      document.getElementById('welcome-title').innerText = `أهلاً بك، ${currentUser.name}`;
      
      const badge = document.getElementById('role-badge');
      if (currentUser.role === 'admin') {
        badge.innerText = 'مسؤول النظام الرئيسي';
        badge.className = 'inline-block px-2.5 py-0.5 text-xs rounded-md bg-rose-500/15 text-rose-400 border border-rose-500/20 mt-1';
        document.getElementById('admin-add-subject-btn').classList.remove('hidden');
      } else if (currentUser.role === 'subadmin') {
        badge.innerText = 'مساعد إدارة معتمد';
        badge.className = 'inline-block px-2.5 py-0.5 text-xs rounded-md bg-amber-500/15 text-amber-400 border border-amber-500/20 mt-1';
      } else if (currentUser.role === 'doctor') {
        badge.innerText = 'دكتور مادة';
        badge.className = 'inline-block px-2.5 py-0.5 text-xs rounded-md bg-purple-500/15 text-purple-400 border border-purple-500/20 mt-1';
      } else {
        badge.innerText = 'طالب';
        badge.className = 'inline-block px-2.5 py-0.5 text-xs rounded-md bg-green-500/15 text-green-400 border border-green-500/20 mt-1';
      }

      if (currentUser.role === 'admin' || currentUser.role === 'subadmin') {
        document.getElementById('management-actions').classList.remove('hidden');
      }

      renderSubjects();
    }

    function renderSubjects() {
      const grid = document.getElementById('subjects-grid');
      grid.innerHTML = '';

      subjects.forEach(sub => {
        const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
        const canUpload = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;
        const isAdmin = currentUser.role === 'admin';
        const contentList = sub.content || [];
        
        let totalFiles = 0;
        contentList.forEach(sec => { if (sec.files) totalFiles += sec.files.length; });

        grid.innerHTML += `
          <div class="supabase-exact-card rounded-2xl p-6 flex flex-col justify-between relative group animate-fade">
            <div>
              <div class="flex justify-between items-start mb-4">
                <span class="p-3 bg-green-500/10 text-green-400 rounded-xl border border-green-500/20">
                  <i class="fa-solid fa-book-open text-lg"></i>
                </span>
                <div class="flex gap-2 flex-wrap">
                  ${isAdmin ? `
                    <button onclick="playClickSound(); editSubject('${sub.id}')" title="تعديل المادة" class="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 rounded-lg text-xs font-semibold transition"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="playClickSound(); deleteSubject('${sub.id}')" title="حذف المادة" class="px-2.5 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 rounded-lg text-xs font-semibold transition"><i class="fa-solid fa-trash"></i></button>
                  ` : ''}
                  ${canUpload ? `<span class="text-xs bg-green-500/10 text-green-400 border border-green-500/20 px-2 py-0.5 rounded-md">صلاحية رفع</span>` : ''}
                </div>
              </div>
              <h3 class="text-lg font-bold text-white mb-1 truncate-text" title="${sub.name}">${sub.name}</h3>
              <p class="text-xs text-gray-400 mb-4 flex items-center gap-1.5 truncate-text"><i class="fa-solid fa-user-tie text-[11px] text-green-400"></i> ${sub.doctor}</p>
            </div>

            <div class="pt-4 border-t border-white/5 flex justify-between items-center">
              <span class="text-xs text-gray-500">${totalFiles} ملفات في ${contentList.length} أقسام</span>
              <button onclick="playClickSound(); openSubjectContent('${sub.id}')" class="px-3.5 py-2 btn-supabase-exact text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5 flex-shrink-0">
                عرض المادة 📂
              </button>
            </div>
          </div>
        `;
      });
    }

    function openLecturesModal() {
      let modalOverlay = document.getElementById('modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }
      const canEdit = currentUser.role === 'admin' || currentUser.role === 'subadmin';

      modalOverlay.innerHTML = `
        <div class="supabase-exact-card rounded-2xl p-6 w-full max-w-xl max-h-[85vh] overflow-y-auto shadow-2xl relative">
          <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-book text-green-400 ml-2"></i> المحاضرات (جدول الترم الثابت)</h2>
            <button onclick="playClickSound(); closeModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 transition"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="space-y-4">
            <div class="bg-[#090a0d] p-4 rounded-xl border border-white/5">
              <p class="text-sm text-gray-300 whitespace-pre-line">${scheduleInfo.lectures || 'لا توجد محاضرات مسجلة.'}</p>
            </div>
            ${canEdit ? `<button onclick="playClickSound(); editLectures()" class="w-full py-2.5 btn-supabase-exact font-bold rounded-xl text-xs transition">تعديل جدول المحاضرات</button>` : ''}
          </div>
        </div>
      `;
    }

    async function editLectures() {
      const newLec = prompt('تعديل جدول المحاضرات الثابت:', scheduleInfo.lectures);
      if (newLec !== null) {
        scheduleInfo.lectures = newLec.trim();
        await supabaseClient.from('configs').upsert([{ key: 'schedule_data', value: scheduleInfo }]);
        openLecturesModal();
        alert('تم التعديل بنجاح!');
      }
    }

    function openSectionsModal() {
      let modalOverlay = document.getElementById('modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }
      const canEdit = currentUser.role === 'admin' || currentUser.role === 'subadmin';

      modalOverlay.innerHTML = `
        <div class="supabase-exact-card rounded-2xl p-6 w-full max-w-xl max-h-[85vh] overflow-y-auto shadow-2xl relative">
          <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-clock text-green-400 ml-2"></i> السكاشن (الجدول الأسبوعي)</h2>
            <button onclick="playClickSound(); closeModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 transition"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="space-y-4">
            <div class="bg-[#090a0d] p-4 rounded-xl border border-white/5">
              <p class="text-sm text-gray-300 whitespace-pre-line">${scheduleInfo.sections || 'لا توجد سيكاشن مضافة لهذا الأسبوع.'}</p>
            </div>
            ${canEdit ? `<button onclick="playClickSound(); editSections()" class="w-full py-2.5 btn-supabase-exact font-bold rounded-xl text-xs transition">تعديل جدول السكاشن الأسبوعي</button>` : ''}
          </div>
        </div>
      `;
    }

    async function editSections() {
      const newSec = prompt('أدخل جدول السكاشن الجديد لهذا الأسبوع:', scheduleInfo.sections);
      if (newSec !== null) {
        scheduleInfo.sections = newSec.trim();
        await supabaseClient.from('configs').upsert([{ key: 'schedule_data', value: scheduleInfo }]);
        openSectionsModal();
        alert('تم تحديث السكاشن بنجاح!');
      }
    }

    function closeModal() {
      const modal = document.getElementById('modal-overlay');
      if (modal) modal.remove();
    }

    async function openAddSubjectModal() {
      if (currentUser.role !== 'admin') return;
      const name = prompt('اسم المادة الجديدة:');
      if (!name) return;
      const doctor = prompt('اسم الدكتور المحاضر:');
      const code = prompt('كود دخول الدكتور للمادة:');
      
      if (name && doctor && code) {
        const newSub = { id: String(Date.now()), name: name.trim(), doctor: doctor.trim(), code: code.trim(), content: [] };
        await supabaseClient.from('subjects').upsert([newSub]);
        dataLoaded = false;
        await loadDataFast();
        renderSubjects();
        alert('تمت إضافة المادة بنجاح!');
      }
    }

    async function editSubject(subId) {
      if (currentUser.role !== 'admin') return;
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const newName = prompt('تعديل اسم المادة:', sub.name);
      if (newName === null) return;
      const newDoc = prompt('تعديل اسم الدكتور:', sub.doctor);
      if (newDoc === null) return;
      const newCode = prompt('تعديل كود الدكتور:', sub.code);
      if (newCode === null) return;

      sub.name = newName || sub.name;
      sub.doctor = newDoc || sub.doctor;
      sub.code = newCode || sub.code;

      await supabaseClient.from('subjects').upsert([sub]);
      renderSubjects();
      alert('تم التعديل بنجاح!');
    }

    async function deleteSubject(subId) {
      if (currentUser.role !== 'admin') return;
      if (!confirm('حذف هذه المادة بالكامل؟')) return;

      await supabaseClient.from('subjects').delete().eq('id', subId);
      dataLoaded = false;
      await loadDataFast();
      renderSubjects();
      alert('تم الحذف بنجاح!');
    }

    async function openSubjectContent(subId) {
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
      const canManage = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;
      if (!sub.content) sub.content = [];

      let modalOverlay = document.getElementById('subject-modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'subject-modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }

      let contentHtml = `
        <div class="supabase-exact-card rounded-2xl p-6 w-full max-w-3xl max-h-[85vh] overflow-y-auto shadow-2xl relative">
            <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3">
                <div class="overflow-hidden pr-2">
                    <h2 class="text-lg font-bold text-white truncate-text" title="${sub.name}">${sub.name}</h2>
                    <p class="text-xs text-green-400 mt-0.5 truncate-text"><i class="fa-solid fa-user-tie"></i> د. ${sub.doctor}</p>
                </div>
                <button onclick="playClickSound(); closeSubjectModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 transition flex-shrink-0">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
      `;

      if (canManage) {
          contentHtml += `
              <div class="mb-5 flex gap-2.5 flex-wrap bg-[#090a0d] p-3.5 rounded-xl border border-white/5">
                  <button onclick="playClickSound(); addNewSection('${sub.id}')" class="px-3.5 py-2 bg-purple-500/10 text-purple-400 border border-purple-500/20 hover:bg-purple-500/20 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                      <i class="fa-solid fa-folder-plus"></i> + قسم جديد
                  </button>
                  <button onclick="playClickSound(); addNewFileToSubject('${sub.id}')" class="px-3.5 py-2 btn-supabase-exact text-white text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                      <i class="fa-solid fa-file-arrow-up"></i> + رفع ملف PDF
                  </button>
              </div>
          `;
      }

      if (sub.content.length === 0) {
          contentHtml += `<div class="text-center py-10 text-gray-500"><i class="fa-solid fa-folder-open text-3xl mb-2 text-gray-600"></i><p class="text-xs">لا توجد أقسام أو ملفات مرفوعة.</p></div>`;
      } else {
          contentHtml += `<div class="space-y-4">`;
          sub.content.forEach((section, sIndex) => {
              contentHtml += `
                  <div class="bg-[#090a0d] border border-white/5 rounded-xl p-3.5">
                      <div class="flex justify-between items-center mb-2.5 border-b border-white/5 pb-2">
                          <h3 class="font-bold text-sm text-green-300 truncate-text pr-2"><i class="fa-solid fa-bookmark text-green-500 text-xs ml-1"></i> ${section.sectionTitle}</h3>
                          ${canManage ? `<button onclick="playClickSound(); deleteSection('${sub.id}',${sIndex})" class="text-rose-400 hover:text-rose-300 text-[11px] px-2 py-0.5 bg-rose-500/10 border border-rose-500/20 rounded-md transition flex-shrink-0"><i class="fa-solid fa-trash"></i></button>` : ''}
                      </div>
              `;
              if (!section.files || section.files.length === 0) {
                  contentHtml += `<p class="text-[11px] text-gray-500 py-1">لا توجد ملفات.</p>`;
              } else {
                  contentHtml += `<div class="space-y-2">`;
                  section.files.forEach((file, fIndex) => {
                      contentHtml += `
                          <div class="flex justify-between items-center bg-white/5 hover:bg-white/10 p-2.5 rounded-lg border border-white/5 transition gap-2">
                              <div class="flex items-center gap-2.5 overflow-hidden">
                                  <span class="p-1.5 bg-red-500/15 text-red-400 rounded-md border border-red-500/20 flex-shrink-0 text-xs"><i class="fa-solid fa-file-pdf"></i></span>
                                  <div class="overflow-hidden">
                                      <h4 class="font-semibold text-xs text-white truncate-text" title="${file.title}">${file.title}</h4>
                                      <span class="text-[10px] text-gray-500">${file.date || ''}</span>
                                  </div>
                              </div>
                              <div class="flex items-center gap-1.5 flex-shrink-0">
                                  <a href="${file.link}" target="_blank" onclick="playClickSound()" class="px-2.5 py-1 btn-supabase-exact text-white text-[11px] font-medium rounded-md transition flex items-center gap-1" title="عرض الملف">
                                      <i class="fa-solid fa-eye text-[10px]"></i> عرض
                                  </a>
                                  ${canManage ? `<button onclick="playClickSound(); deleteFile('${sub.id}', ${sIndex},${fIndex})" class="p-1 bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 rounded-md text-[11px] transition" title="حذف الملف"><i class="fa-solid fa-trash"></i></button>` : ''}
                              </div>
                          </div>
                      `;
                  });
                  contentHtml += `</div>`;
              }
              contentHtml += `</div>`;
          });
          contentHtml += `</div>`;
      }
      contentHtml += `</div>`;
      modalOverlay.innerHTML = contentHtml;
    }

    function closeSubjectModal() {
        const modal = document.getElementById('subject-modal-overlay');
        if (modal) modal.remove();
    }

    async function addNewSection(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub) return;
        const secTitle = prompt('عنوان القسم (مثل: Lectures / الأسبوع الأول):');
        if (!secTitle) return;

        sub.content.push({ sectionTitle: secTitle.trim(), files: [] });
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function addNewFileToSubject(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || sub.content.length === 0) {
            alert('الرجاء إضافة قسم أولاً!');
            return;
        }

        let listSec = "اختر رقم القسم:\n";
        sub.content.forEach((sec, idx) => { listSec += `${idx + 1}. ${sec.sectionTitle}\n`; });
        const sIdx = parseInt(prompt(listSec)) - 1;

        if (isNaN(sIdx) || sIdx < 0 || sIdx >= sub.content.length) return;

        const title = prompt('اسم الملف (PDF Title):');
        const link = prompt('رابط Google Drive للـ PDF:');

        if (title && link) {
            sub.content[sIdx].files.push({
                id: String(Date.now()),
                title: title.trim(),
                link: link.trim(),
                date: new Date().toLocaleDateString('ar-EG')
            });
            await supabaseClient.from('subjects').upsert([sub]);
            openSubjectContent(subId);
            renderSubjects();
            alert('تم رفع الملف بنجاح!');
        }
    }

    async function deleteSection(subId, sIdx) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !confirm('حذف هذا القسم؟')) return;
        sub.content.splice(sIdx, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function deleteFile(subId, sIdx, fIdx) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !confirm('حذف هذا الملف؟')) return;
        sub.content[sIdx].files.splice(fIdx, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function openAddStudentModal() {
      const name = prompt('اسم الطالب:');
      const code = prompt('كود الطالب:');
      if (name && code) {
        await supabaseClient.from('students').insert([{ name: name.trim(), code: String(code).trim() }]);
        dataLoaded = false;
        await loadDataFast();
        alert('تمت إضافة الطالب بنجاح!');
      }
    }

    async function openUsersModal() {
      await loadDataFast();
      let info = "الأكواد المسجلة:\n\n-- الدكاترة --\n";
      subjects.forEach(s => { info += `${s.name}: د. ${s.doctor} (كود: ${s.code})\n`; });
      info += "\n-- الطلاب --\n";
      students.forEach(s => { info += `${s.name} (كود: ${s.code})\n`; });
      alert(info);
    }

    function logout() {
      localStorage.removeItem('currentUser_v12');
      location.reload();
    }
  </script>
</body>
</html>
