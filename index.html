<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة الرقمية الجامعية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0c0d10;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #ededed;
    }
    .supabase-exact-card {
      background-color: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .supabase-exact-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 197, 94, 0.4);
    }
    .supabase-exact-input {
      background-color: #090a0d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      transition: all 0.2s ease;
    }
    .supabase-exact-input:focus {
      border-color: #22c55e;
      outline: none;
      background-color: #0c0d10;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
    }
    .btn-smooth {
      transition: all 0.2s ease;
    }
    .btn-smooth:active {
      transform: scale(0.96);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
  <script>
    const savedUser = localStorage.getItem('currentUser_v4');
    if (savedUser) {
      document.documentElement.style.visibility = 'hidden';
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.documentElement.style.visibility = 'visible';
      });
    }
  </script>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen relative">

  <!-- شاشة التحميل -->
  <div id="global-loader" class="hidden fixed inset-0 bg-[#0c0d10]/90 backdrop-blur-md flex flex-col items-center justify-center z-50 transition-opacity duration-200">
    <div class="p-4 rounded-2xl bg-green-500/10 text-green-500 border border-green-500/20 mb-4 shadow-lg animate-spin" style="animation-duration: 1s;">
      <i class="fa-solid fa-spinner text-3xl"></i>
    </div>
    <p id="loader-text" class="text-white font-semibold text-sm">جاري التحقق والاتصال بقاعدة البيانات...</p>
  </div>

  <div class="w-full max-w-6xl animate-fade">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="supabase-exact-card rounded-3xl p-8 max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex p-4 rounded-2xl bg-green-500/10 text-green-500 mb-3 border border-green-500/20 shadow-inner">
          <i class="fa-solid fa-graduation-cap text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">المكتبة الرقمية الجامعية</h2>
        <p class="text-gray-400 text-sm mt-1">أدخل اسمك والكود الخاص بك للدخول الآمن</p>
      </div>

      <form id="login-form" onsubmit="handleSmartLogin(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الاسم بالكامل</label>
          <input type="text" id="user-name" required placeholder="أدخل اسمك المسجل..." class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-gray-300">الكود السري للدخول</label>
          <input type="password" id="user-code" required placeholder="أدخل كودك الخاص..." class="w-full p-3.5 rounded-xl supabase-exact-input placeholder-gray-500">
        </div>

        <button type="submit" class="w-full py-3.5 bg-green-600 hover:bg-green-500 font-bold rounded-xl transition-all shadow-lg shadow-green-600/30 btn-smooth text-white">
          دخول المنصة 🚀
        </button>
      </form>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="app-screen" class="hidden space-y-6 animate-fade">
      <header class="supabase-exact-card rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="p-3 bg-green-500/10 rounded-xl border border-green-500/20 text-green-500">
            <i class="fa-solid fa-book-bookmark text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white" id="welcome-title">مرحباً بك في المكتبة الرقمية الجامعية</h1>
            <span id="role-badge" class="inline-block px-3 py-1 text-xs rounded-full bg-green-500/20 text-green-300 border border-green-500/30 mt-1">طالب</span>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <!-- زر الترس العصري السحابي للسكاشن والأقسام -->
          <button onclick="openSectionsHubModal()" title="قسم السكاشن والأقسام" class="p-2.5 bg-white/5 hover:bg-white/10 text-green-400 border border-white/10 rounded-xl transition flex items-center gap-2 btn-smooth shadow-inner">
            <i class="fa-solid fa-gear text-lg animate-spin" style="animation-duration: 8s;"></i>
            <span class="text-xs font-semibold hidden md:inline">السكاشن</span>
          </button>

          <div id="management-actions" class="hidden flex gap-2 flex-wrap">
            <button onclick="openUsersModal()" class="px-4 py-2 bg-blue-600/80 hover:bg-blue-600 text-sm font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-users"></i> المستخدمين
            </button>
            <button onclick="openAddStudentModal()" class="px-4 py-2 bg-emerald-600/80 hover:bg-emerald-600 text-sm font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-user-plus"></i> + طالب
            </button>
            <button onclick="openAddSubjectModal()" id="admin-add-subject-btn" class="hidden px-4 py-2 bg-purple-600/80 hover:bg-purple-600 text-sm font-semibold rounded-xl transition flex items-center gap-2 btn-smooth text-white">
              <i class="fa-solid fa-folder-plus"></i> + مادة
            </button>
          </div>

          <button onclick="logout()" class="px-4 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600/30 text-sm font-semibold rounded-xl transition flex items-center gap-2 btn-smooth">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
          </button>
        </div>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="subjects-grid">
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://daapgugcfilwljswxwku.supabase.co";
    const SUPABASE_KEY = "sb_publishable__3MPuIGColJm2-LjAD3VbQ_y4ygMffp";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_CODE = "ADMIN2026";
    const SUBADMIN_CODE = "SUBADMIN2026";

    let defaultSubjects = [
      { id: '1', name: 'أساسيات إدارة الأعمال', doctor: 'أ.د.م. أحمد سيد عبد الباسط مصطفي', code: 'DOC101', content: [] },
      { id: '2', name: 'مقدمة في نظم المعلومات', doctor: 'د. محمد حامد حامد', code: 'DOC102', content: [] },
      { id: '3', name: 'المحاسبة المالية', doctor: 'د. ناهد سعد أحمد سعد', code: 'DOC103', content: [] },
      { id: '4', name: 'مقدمة في الاقتصاد الجزئي', doctor: 'د. محمد عبد المنعم محمد الشهاوي', code: 'DOC104', content: [] },
      { id: '5', name: 'رياضة مالية', doctor: 'أ.د.م. محمد جمال محمد إبراهيم', code: 'DOC105', content: [] }
    ];

    let subjects = [];
    let students = [];
    let currentUser = JSON.parse(localStorage.getItem('currentUser_v4')) || null;

    function showLoader(text = "جاري التحقق...") {
      const loader = document.getElementById('global-loader');
      document.getElementById('loader-text').innerText = text;
      loader.classList.remove('hidden');
    }

    function hideLoader() {
      document.getElementById('global-loader').classList.add('hidden');
    }

    window.onload = function() {
      if (currentUser) {
        showLoader("جاري استرجاع الجلسة وسحب البيانات...");
        loadDataFromSupabase().then(() => {
          hideLoader();
          showAppScreen();
        });
      }
    };

    async function loadDataFromSupabase() {
      try {
        const { data: dbStudents } = await supabaseClient.from('students').select('*');
        if (dbStudents && dbStudents.length > 0) {
          students = dbStudents;
        } else {
          students = [{ name: 'طالب تجريبي', code: '1234' }];
        }

        const { data: dbSubjects } = await supabaseClient.from('subjects').select('*');
        if (dbSubjects && dbSubjects.length > 0) {
          subjects = dbSubjects;
        } else {
          subjects = defaultSubjects;
          for(let sub of defaultSubjects) {
            await supabaseClient.from('subjects').upsert([sub]);
          }
        }
      } catch (err) {
        console.log("خطأ في الاتصال، جارٍ استخدام النسخة المحلية");
        subjects = defaultSubjects;
        students = [{ name: 'طالب تجريبي', code: '1234' }];
      }
    }

    async function handleSmartLogin(e) {
      e.preventDefault();
      showLoader("جاري التحقق من قاعدة البيانات وسحب البيانات...");
      
      const nameInput = document.getElementById('user-name').value.trim();
      const codeInput = document.getElementById('user-code').value.trim();

      await loadDataFromSupabase();

      if (codeInput === ADMIN_CODE) {
        currentUser = { role: 'admin', name: nameInput || 'مسؤول النظام (الأدمن)' };
      } else if (codeInput === SUBADMIN_CODE) {
        currentUser = { role: 'subadmin', name: nameInput || 'مساعد مسؤول النظام' };
      } else {
        const docSub = subjects.find(s => String(s.code).trim() === codeInput);
        if (docSub) {
          currentUser = { role: 'doctor', subjectId: docSub.id, name: nameInput ? `${nameInput} (${docSub.doctor})` : docSub.doctor };
        } else {
          const student = students.find(s => 
            String(s.name).trim().toLowerCase() === nameInput.toLowerCase() && 
            String(s.code).trim() === codeInput
          );
          
          if (student) {
            currentUser = { role: 'student', name: student.name };
          } else {
            hideLoader();
            alert('الاسم أو الكود السري غير صحيح، أو غير متطابقين في قاعدة البيانات!');
            return;
          }
        }
      }

      localStorage.setItem('currentUser_v4', JSON.stringify(currentUser));
      hideLoader();
      showAppScreen();
    }

    function showAppScreen() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      document.getElementById('welcome-title').innerText = `أهلاً بك، ${currentUser.name}`;
      
      const badge = document.getElementById('role-badge');
      if (currentUser.role === 'admin') {
        badge.innerText = 'مسؤول النظام (الأدمن)';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-rose-500/25 text-rose-300 border border-rose-500/40 mt-1';
        document.getElementById('admin-add-subject-btn').classList.remove('hidden');
      } else if (currentUser.role === 'subadmin') {
        badge.innerText = 'مساعد مسؤول النظام';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-amber-500/25 text-amber-300 border border-amber-500/40 mt-1';
      } else if (currentUser.role === 'doctor') {
        badge.innerText = 'دكتور مادة';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-purple-500/25 text-purple-300 border border-purple-500/40 mt-1';
      } else {
        badge.innerText = 'طالب';
        badge.className = 'inline-block px-3 py-1 text-xs rounded-full bg-green-500/25 text-green-300 border border-green-500/30 mt-1';
      }

      if (currentUser.role === 'admin' || currentUser.role === 'subadmin') {
        document.getElementById('management-actions').classList.remove('hidden');
      }

      renderSubjects();
    }

    async function renderSubjects() {
      await loadDataFromSupabase();
      const grid = document.getElementById('subjects-grid');
      grid.innerHTML = '';

      subjects.forEach(sub => {
        const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
        const canUpload = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;
        const isAdmin = currentUser.role === 'admin';
        const contentList = sub.content || [];
        
        let totalFiles = 0;
        contentList.forEach(sec => {
          if (sec.files) totalFiles += sec.files.length;
        });

        grid.innerHTML += `
          <div class="supabase-exact-card rounded-2xl p-6 flex flex-col justify-between relative group animate-fade">
            <div>
              <div class="flex justify-between items-start mb-4">
                <span class="p-3 bg-green-500/10 text-green-400 rounded-xl border border-green-500/20">
                  <i class="fa-solid fa-book-open text-2xl"></i>
                </span>
                <div class="flex gap-2 flex-wrap">
                  ${isAdmin ? `
                    <button onclick="editSubject('${sub.id}')" title="تعديل المادة" class="px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30 rounded-lg text-xs font-semibold transition btn-smooth"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteSubject('${sub.id}')" title="حذف المادة بالكامل" class="px-2.5 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 rounded-lg text-xs font-semibold transition btn-smooth"><i class="fa-solid fa-trash"></i></button>
                  ` : ''}
                  ${canUpload ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg">صلاحية رفع</span>` : ''}
                </div>
              </div>
              <h3 class="text-xl font-bold text-white mb-2">${sub.name}</h3>
              <p class="text-sm text-gray-300 mb-4 flex items-center gap-2"><i class="fa-solid fa-user-tie text-xs text-green-400"></i> ${sub.doctor}</p>
            </div>

            <div class="pt-4 border-t border-white/10 flex justify-between items-center">
              <span class="text-xs text-gray-400">${totalFiles} ملفات في ${contentList.length} أقسام</span>
              <button onclick="openSubjectContent('${sub.id}')" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 btn-smooth shadow-lg shadow-green-600/20">
                عرض المادة 📂
              </button>
            </div>
          </div>
        `;
      });
    }

    // فتح نافذة السكاشن العامة عبر أيقونة الترس العصري
    async function openSectionsHubModal() {
      await loadDataFromSupabase();
      let modalOverlay = document.getElementById('sections-hub-modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'sections-hub-modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }

      let hubHtml = `
        <div class="supabase-exact-card rounded-3xl p-6 w-full max-w-4xl max-h-[85vh] overflow-y-auto border border-white/20 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <div class="flex items-center gap-3">
                    <span class="p-3 bg-green-500/10 text-green-400 rounded-xl border border-green-500/20">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </span>
                    <div>
                        <h2 class="text-xl font-bold text-white">مركز السكاشن والأقسام الجامعية</h2>
                        <p class="text-xs text-gray-400 mt-0.5">استعراض جميع السكاشن مرتبة حسب المواد والدكاترة</p>
                    </div>
                </div>
                <button onclick="closeSectionsHubModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/10 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="space-y-6">
      `;

      if (subjects.length === 0) {
        hubHtml += `<div class="text-center py-12 text-gray-400"><p>لا توجد مواد أو سكاشن مسجلة حالياً.</p></div>`;
      } else {
        subjects.forEach(sub => {
          const contentList = sub.content || [];
          hubHtml += `
            <div class="bg-white/5 border border-white/10 rounded-2xl p-5">
              <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                <div>
                  <h3 class="text-base font-bold text-green-300 flex items-center gap-2">
                    <i class="fa-solid fa-book text-green-400 text-xs"></i> ${sub.name}
                  </h3>
                  <span class="text-xs text-gray-400 mt-0.5 block"><i class="fa-solid fa-user-tie text-[10px]"></i> د. ${sub.doctor}</span>
                </div>
                <button onclick="closeSectionsHubModal(); openSubjectContent('${sub.id}')" class="px-3 py-1.5 bg-green-600/20 text-green-400 hover:bg-green-600/30 border border-green-500/30 text-xs rounded-lg transition btn-smooth">
                  إدارة المادة 📂
                </button>
              </div>
          `;

          if (contentList.length === 0) {
            hubHtml += `<p class="text-xs text-gray-500 py-1">لا توجد سكاشن أو محاضرات مرفوعة لهذه المادة حتى الآن.</p>`;
          } else {
            hubHtml += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">`;
            contentList.forEach((sec, sIdx) => {
              const fileCount = sec.files ? sec.files.length : 0;
              hubHtml += `
                <div class="bg-[#090a0d] p-3.5 rounded-xl border border-white/5 flex justify-between items-center">
                  <div>
                    <h4 class="text-sm font-semibold text-white flex items-center gap-1.5">
                      <i class="fa-solid fa-bookmark text-green-400 text-xs"></i> ${sec.sectionTitle}
                    </h4>
                    <span class="text-[11px] text-gray-400 mt-1 block">${fileCount} ملفات PDF متاحة</span>
                  </div>
                  <button onclick="closeSectionsHubModal(); openSubjectContent('${sub.id}')" class="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-white text-xs rounded-lg transition">
                    عرض
                  </button>
                </div>
              `;
            });
            hubHtml += `</div>`;
          }
          hubHtml += `</div>`;
        });
      }

      hubHtml += `</div></div>`;
      modalOverlay.innerHTML = hubHtml;
    }

    function closeSectionsHubModal() {
      const modal = document.getElementById('sections-hub-modal-overlay');
      if (modal) modal.remove();
    }

    async function openAddSubjectModal() {
      if (currentUser.role !== 'admin') return;
      const name = prompt('اسم المادة الجديدة:');
      if (!name) return;
      const doctor = prompt('اسم الدكتور المحاضر:');
      const code = prompt('كود دخول الدكتور الخاص بالمادة (مثل DOC106):');
      
      if (name && doctor && code) {
        const newSub = {
          id: String(Date.now()),
          name: name.trim(),
          doctor: doctor.trim(),
          code: code.trim(),
          content: []
        };
        await supabaseClient.from('subjects').upsert([newSub]);
        await renderSubjects();
        alert('تمت إضافة المادة الجديدة بنجاح أونلاين!');
      }
    }

    async function editSubject(subId) {
      if (currentUser.role !== 'admin') return;
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const newName = prompt('تعديل اسم المادة:', sub.name);
      if (newName === null) return;
      
      const newDoc = prompt('تعديل اسم الدكتور المحاضر:', sub.doctor);
      if (newDoc === null) return;

      const newCode = prompt('تعديل كود دخول الدكتور للمادة:', sub.code);
      if (newCode === null) return;

      sub.name = newName || sub.name;
      sub.doctor = newDoc || sub.doctor;
      sub.code = newCode || sub.code;

      await supabaseClient.from('subjects').upsert([sub]);
      renderSubjects();
      alert('تم تحديث بيانات المادة وحفظها أونلاين بنجاح!');
    }

    async function deleteSubject(subId) {
      if (currentUser.role !== 'admin') return;
      const confirmDel = confirm('هل أنت متأكد من حذف هذه المادة بالكامل من المنصة؟');
      if (!confirmDel) return;

      await supabaseClient.from('subjects').delete().eq('id', subId);
      await renderSubjects();
      alert('تم حذف المادة بنجاح!');
    }

    async function openSubjectContent(subId) {
      await loadDataFromSupabase();
      const sub = subjects.find(s => s.id === subId);
      if (!sub) return;

      const isDoc = currentUser.role === 'doctor' && currentUser.subjectId === sub.id;
      const canManage = currentUser.role === 'admin' || currentUser.role === 'subadmin' || isDoc;

      if (!sub.content || !Array.isArray(sub.content)) {
        sub.content = [];
      }

      let modalOverlay = document.getElementById('subject-modal-overlay');
      if (!modalOverlay) {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'subject-modal-overlay';
        modalOverlay.className = 'fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade';
        document.body.appendChild(modalOverlay);
      }

      let contentHtml = `
        <div class="supabase-exact-card rounded-3xl p-6 w-full max-w-3xl max-h-[85vh] overflow-y-auto border border-white/20 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-white">${sub.name}</h2>
                    <p class="text-sm text-green-300 mt-1"><i class="fa-solid fa-user-tie"></i> د. ${sub.doctor}</p>
                </div>
                <button onclick="closeSubjectModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/10 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
      `;

      if (canManage) {
          contentHtml += `
              <div class="mb-6 flex gap-3 flex-wrap bg-green-950/20 p-4 rounded-2xl border border-green-500/30">
                  <button onclick="addNewSection('${sub.id}')" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold rounded-xl transition flex items-center gap-2 shadow-lg btn-smooth">
                      <i class="fa-solid fa-folder-plus"></i> + إضافة سكشن / قسم جديد
                  </button>
                  <button onclick="addNewFileToSubject('${sub.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl transition flex items-center gap-2 shadow-lg btn-smooth">
                      <i class="fa-solid fa-file-arrow-up"></i> + إضافة ملف PDF لقسم
                  </button>
              </div>
          `;
      }

      if (sub.content.length === 0) {
          contentHtml += `
              <div class="text-center py-12 text-gray-400">
                  <i class="fa-solid fa-folder-open text-4xl mb-3 text-green-400"></i>
                  <p>لا توجد سكاشن أو ملفات مرفوعة لهذه المادة حتى الآن.</p>
              </div>
          `;
      } else {
          contentHtml += `<div class="space-y-6">`;
          sub.content.forEach((section, sIndex) => {
              contentHtml += `
                  <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                      <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                          <h3 class="font-bold text-lg text-green-200 flex items-center gap-2">
                              <i class="fa-solid fa-bookmark text-green-400 text-sm"></i> ${section.sectionTitle || 'محتوى عام'}
                          </h3>
                          ${canManage ? `
                              <button onclick="deleteSection('${sub.id}',${sIndex})" class="text-rose-400 hover:text-rose-300 text-xs px-2.5 py-1 bg-rose-500/10 border border-rose-500/20 rounded-lg transition btn-smooth">
                                  <i class="fa-solid fa-trash"></i> حذف القسم
                              </button>
                          ` : ''}
                      </div>
              `;

              if (!section.files || section.files.length === 0) {
                  contentHtml += `<p class="text-xs text-gray-400 py-2">لا توجد ملفات في هذا القسم بعد.</p>`;
              } else {
                  contentHtml += `<div class="space-y-2">`;
                  section.files.forEach((file, fIndex) => {
                      contentHtml += `
                          <div class="flex justify-between items-center bg-white/5 hover:bg-white/10 p-3 rounded-xl border border-white/5 transition">
                              <div class="flex items-center gap-3">
                                  <span class="p-2 bg-red-500/20 text-red-400 rounded-lg border border-red-500/30">
                                      <i class="fa-solid fa-file-pdf"></i>
                                  </span>
                                  <div>
                                      <h4 class="font-semibold text-sm text-white">${file.title}</h4>
                                      <span class="text-xs text-gray-400">${file.date || ''}</span>
                                  </div>
                              </div>
                              <div class="flex items-center gap-2">
                                  <a href="${file.link}" target="_blank" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white text-xs font-medium rounded-lg transition flex items-center gap-1.5 btn-smooth">
                                      <i class="fa-solid fa-eye"></i> عرض
                                  </a>
                                  ${canManage ? `
                                      <button onclick="deleteFile('${sub.id}',${sIndex},${fIndex})" class="p-1.5 bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 rounded-lg text-xs transition btn-smooth" title="حذف الملف">
                                          <i class="fa-solid fa-trash"></i>
                                      </button>
                                  ` : ''}
                              </div>
                          </div>
                      `;
                  });
                  contentHtml += `</div>`;
              }
              contentHtml += `</div>`;
          });
          contentHtml += `</div>`;
      }

      contentHtml += `</div>`;
      modalOverlay.innerHTML = contentHtml;
    }

    function closeSubjectModal() {
        const modal = document.getElementById('subject-modal-overlay');
        if (modal) modal.remove();
    }

    async function addNewSection(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub) return;
        const secTitle = prompt('عنوان السكشن أو القسم (مثل: سكشن المحاسبة - الأسبوع الأول):');
        if (!secTitle) return;

        if (!sub.content) sub.content = [];
        sub.content.push({ sectionTitle: secTitle.trim(), files: [] });

        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function addNewFileToSubject(subId) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !sub.content || sub.content.length === 0) {
            alert('الرجاء إضافة قسم أولاً لتتمكن من رفع الملف بداخله!');
            return;
        }

        let listSec = "اختر رقم القسم المراد الرفع فيه:\n";
        sub.content.forEach((sec, idx) => {
            listSec += `${idx + 1}. ${sec.sectionTitle}\n`;
        });
        const sIdx = parseInt(prompt(listSec)) - 1;

        if (isNaN(sIdx) || sIdx < 0 || sIdx >= sub.content.length) return;

        const title = prompt('اسم الملف (PDF Title):');
        const link = prompt('رابط الملف (رابط مباشر أو رابط Google Drive):');

        if (title && link) {
            if (!sub.content[sIdx].files) sub.content[sIdx].files = [];
            sub.content[sIdx].files.push({
                id: String(Date.now()),
                title: title.trim(),
                link: link.trim(),
                date: new Date().toLocaleDateString('ar-EG')
            });

            await supabaseClient.from('subjects').upsert([sub]);
            openSubjectContent(subId);
            renderSubjects();
            alert('تم رفع الملف بنجاح وحفظه أونلاين!');
        }
    }

    async function deleteSection(subId, sIndex) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !confirm('هل أنت متأكد من حذف هذا القسم بالكامل؟')) return;

        sub.content.splice(sIndex, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function deleteFile(subId, sIndex, fIndex) {
        const sub = subjects.find(s => s.id === subId);
        if (!sub || !confirm('هل أنت متأكد من حذف هذا الملف؟')) return;

        sub.content[sIndex].files.splice(fIndex, 1);
        await supabaseClient.from('subjects').upsert([sub]);
        openSubjectContent(subId);
        renderSubjects();
    }

    async function openAddStudentModal() {
      if (currentUser.role !== 'admin' && currentUser.role !== 'subadmin') return;
      const name = prompt('اسم الطالب الجديد:');
      if (!name) return;
      const code = prompt('كود الطالب الخاص بالدخول:');
      if (!code) return;

      if (name && code) {
        await supabaseClient.from('students').insert([{ name: name.trim(), code: code.trim() }]);
        await loadDataFromSupabase();
        alert('تمت إضافة الطالب بنجاح لقاعدة البيانات أونلاين!');
      }
    }

    function openUsersModal() {
      let info = "قائمة الطلاب المسجلين في النظام:\n\n";
      students.forEach(s => {
        info += `- ${s.name} (الكود: ${s.code})\n`;
      });
      alert(info);
    }

    function logout() {
      localStorage.removeItem('currentUser_v4');
      location.reload();
    }
  </script>
</body>
</html>
